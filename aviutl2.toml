#:schema ./.aviutl2-cli/aviutl2.schema.json
# 設定ファイルについては https://github.com/sevenc-nanashi/aviutl2-cli を参照してください。

[project]
id = "sevenc-nanashi.aviutl2_scripts"
name = "aviutl2-scripts"
version = "0.1.0"

[development]
aviutl2_version = "latest"
catalog_dependencies = [
  "sigma-axis.Basic_S",
  "sigma-axis.PixelSnap_S",
  "sevenc-nanashi.aviutl2-rs.rusty_pixelsort",
  "korarei.PixelSorter_K",
]

[build_group]
aulua = "rake"
demo = "rake demo"

[artifacts.pixel_transform-anm2]
build.group = "aulua"
source = "scripts/ドット絵変形.anm2"
destination = "Script/ドット絵変形.anm2"

[artifacts.pixel_transform-anm2-i18n-ja]
source = "scripts/ドット絵変形/extra/Language/Default.pixel_transform-anm2.aul2"
destination = "Language/Default.pixel_transform-anm2.aul2"

[artifacts.pixel_transform-anm2-i18n-en]
source = "scripts/ドット絵変形/extra/Language/English.pixel_transform-anm2.aul2"
destination = "Language/English.pixel_transform-anm2.aul2"

[artifacts.pixel_transform-demo-anm2]
build.group = "aulua"
source = "demo/@ドット絵変形.anm2"
destination = "Script/@ドット絵変形.anm2"

[artifacts.targeted_scale-anm2]
