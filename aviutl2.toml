#:schema ./.aviutl2-cli/aviutl2.schema.json
# 設定ファイルについては https://github.com/sevenc-nanashi/aviutl2-cli を参照してください。
[project]
id = "sevenc-nanashi.aviutl2_scripts"
name = "aviutl2-scripts"
version = "0.1.0"

[development]
aviutl2_version = "latest"
catalog_dependencies = ["sigma-axis.Basic_S", "sigma-axis.PixelSnap_S"]

[build_group]
aulua = "rake"
demo = "rake demo"

[artifacts.pixel_transform-anm2]
build.group = "aulua"
source = "scripts/ドット絵変形.anm2"
destination = "Script/ドット絵変形.anm2"

[artifacts.targeted_scale-anm2]
build.group = "aulua"
source = "scripts/目標指定拡大縮小.anm2"
destination = "Script/目標指定拡大縮小.anm2"

[artifacts.camera_frame-obj2]
build.group = "aulua"
source = "scripts/カメラフレーム.obj2"
destination = "Script/カメラフレーム.obj2"

[artifacts.shorts_guide-obj2]
build.group = "aulua"
source = "scripts/縦動画ガイド.obj2"
destination = "Script/縦動画ガイド.obj2"

[artifacts.crt_display-anm2]
build.group = "aulua"
source = "scripts/CRTディスプレイ.anm2"
destination = "Script/CRTディスプレイ.anm2"

[artifacts.pixel_transform-demo-anm2]
build.group = "aulua"
source = "demo/@ドット絵変形.anm2"
destination = "Script/@ドット絵変形.anm2"

[artifacts.targeted_scale-demo-anm2]
build = { group = "demo" }
source = "demo/@目標指定拡大縮小.anm2"
destination = "Script/@目標指定拡大縮小.anm2"

[artifacts.camera_frame-demo-obj2]
build = { group = "demo" }
source = "demo/@カメラフレーム.obj2"
destination = "Script/@カメラフレーム.obj2"

[artifacts.shorts_guide-demo-obj2]
build = { group = "demo" }
source = "demo/@縦動画ガイド.obj2"
destination = "Script/@縦動画ガイド.obj2"

[artifacts.crt_display-demo-anm2]
build = { group = "demo" }
source = "demo/@CRTディスプレイ.anm2"
destination = "Script/@CRTディスプレイ.anm2"
